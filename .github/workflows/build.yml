name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip app
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/Marquee.app Marquee.zip
      - uses: actions/upload-artifact@v4
        with:
          name: marquee-macos
          path: Marquee.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip release folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Marquee-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: marquee-windows
          path: Marquee-windows.zip

  ao-pcm-spike:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prove ao=pcm exists in bundled libmpv (macOS)
        if: runner.os == 'macOS'
        run: flutter test integration_test/ao_pcm_test.dart -d macos
      - name: Prove ao=pcm exists in bundled libmpv (Windows)
        if: runner.os == 'Windows'
        run: flutter test integration_test/ao_pcm_test.dart -d windows
